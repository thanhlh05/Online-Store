$kind: http-request
url: "{{base_url}}/order?page=1&size=10"
method: GET
queryParams:
  page: "1"
  size: "10"
auth:
  type: bearer
  credentials:
    token: "{{manager_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Manager lấy danh sách đơn thành công - Status 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
