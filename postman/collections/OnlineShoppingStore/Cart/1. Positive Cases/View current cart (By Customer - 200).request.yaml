$kind: http-request
url: "{{base_url}}/cart"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Customer xem giỏ hàng - Status 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
