$kind: http-request
url: "{{base_url}}/cart/add"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"productId": "B0001", "quantity": 2}'
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Customer thêm SP vào giỏ hàng - Status 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
