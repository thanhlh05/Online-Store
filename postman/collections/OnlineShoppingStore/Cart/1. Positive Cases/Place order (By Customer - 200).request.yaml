$kind: http-request
url: "{{base_url}}/cart/checkout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Customer checkout thành công - Status 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
