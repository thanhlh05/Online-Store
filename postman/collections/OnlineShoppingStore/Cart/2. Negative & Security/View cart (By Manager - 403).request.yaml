$kind: http-request
url: "{{base_url}}/cart"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{manager_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Manager không được xem cart - Status 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 1000
