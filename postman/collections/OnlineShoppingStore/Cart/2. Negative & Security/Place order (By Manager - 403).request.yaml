$kind: http-request
url: "{{base_url}}/cart/checkout"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{manager_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Manager không được checkout - Status 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 4000
