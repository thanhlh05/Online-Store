$kind: http-request
url: "{{base_url}}/cart/B0001"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"quantity": 2}'
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Gửi JSON vào API số nguyên - Status 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
