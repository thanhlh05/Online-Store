$kind: http-request
name: DT-04 POST /login (customer1)
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "customer1@email.com",
        "password": "123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      if (pm.response.code === 200) {
          var res = pm.response.json();
          pm.environment.set("customer_token", res.token || res.jwt);
      }
    language: text/javascript
order: 8000
