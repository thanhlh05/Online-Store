$kind: http-request
name: DT-03 Guest POST /seller/product/new
url: "{{base_url}}/seller/product/new"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "productId": "DT-{{$timestamp}}",
        "productName": "DT Product",
        "productPrice": 100,
        "productStock": 10,
        "productDescription": "Decision Table test",
        "productIcon": "https://via.placeholder.com/150",
        "productStatus": 0,
        "categoryType": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 7000
