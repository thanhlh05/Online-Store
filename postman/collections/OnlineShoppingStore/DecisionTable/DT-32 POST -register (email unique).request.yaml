$kind: http-request
name: DT-32 POST /register (email unique)
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "reg_{{$timestamp}}@email.com",
        "password": "123",
        "name": "New Registered User",
        "phone": "0987654321",
        "address": "456 Side St"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 36000
