$kind: http-request
name: DT-25 Customer POST /seller/product/new
url: "{{base_url}}/seller/product/new"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customer_token}}
body:
  type: json
  content: |-
    {
        "productId": "DT-{{$timestamp}}",
        "productName": "DT Product",
        "productPrice": 100,
        "productStock": 10,
        "productDescription": "Decision Table test",
        "productIcon": "https://via.placeholder.com/150",
        "productStatus": 0,
        "categoryType": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 29000
