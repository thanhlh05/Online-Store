$kind: http-request
name: "TC-REG-ROB-03: email min- (5 chars)"
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "aaaaa",
      "password": "123",
      "name": "Test User",
      "phone": "0998058953",
      "address": "123 Test Street"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 24000
