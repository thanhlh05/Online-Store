$kind: http-request
name: "TC-REG-BVA-03: email min+ (7 chars)"
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "u35@a.c",
      "password": "123",
      "name": "Test User",
      "phone": "0921395656",
      "address": "123 Test Street"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
