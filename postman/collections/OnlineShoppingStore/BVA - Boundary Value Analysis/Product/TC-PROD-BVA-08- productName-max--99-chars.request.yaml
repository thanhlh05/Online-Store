$kind: http-request
name: "TC-PROD-BVA-08: productName max- (99 chars) → Accept 200"
url: "{{base_url}}/seller/product/new"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "PROD008",
      "productName": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
      "productPrice": 40,
      "productStock": 100,
      "productDescription": "Sample description",
      "categoryType": 0,
      "productStatus": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{manager_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-PROD-BVA-08: productName max- (99 chars) → 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
