$kind: http-request
name: "TC-CART-BVA-03: productId min+ (ABCD, 4 chars) → Accept 200"
url: "{{base_url}}/cart/add"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "ABCD",
      "quantity": 5
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-CART-BVA-03: productId min+ (ABCD, 4 chars) → 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
