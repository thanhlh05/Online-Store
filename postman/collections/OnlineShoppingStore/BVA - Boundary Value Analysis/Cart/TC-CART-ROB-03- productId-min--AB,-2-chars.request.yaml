$kind: http-request
name: "TC-CART-ROB-03: productId min- (AB, 2 chars) → Reject 400"
url: "{{base_url}}/cart/add"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "AB",
      "quantity": 5
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-CART-ROB-03: productId min- (AB, 2 chars) → 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 12000
