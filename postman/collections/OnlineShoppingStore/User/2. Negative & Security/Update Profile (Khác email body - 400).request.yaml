$kind: http-request
url: "{{base_url}}/profile"
method: PUT
body:
  type: json
  content: |-
    {
      "email": "otheruser@email.com",
      "password": "123",
      "name": "Hacker",
      "phone": "0123456789",
      "address": "Unknown St"
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Sửa Profile email khác token - Status 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
