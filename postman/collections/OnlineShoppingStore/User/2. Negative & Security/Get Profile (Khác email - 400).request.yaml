$kind: http-request
url: "{{base_url}}/profile/otheruser@email.com"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Xem sai Profile bị chặn - Status 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
