$kind: http-request
url: "{{base_url}}/login"
method: POST
body:
  type: json
  content: |-
    {
      "username": "customer1@email.com",
      "password": "wrongpass"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login sai password - 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
