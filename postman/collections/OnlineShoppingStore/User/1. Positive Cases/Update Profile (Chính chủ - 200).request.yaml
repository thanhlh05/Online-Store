$kind: http-request
url: "{{base_url}}/profile"
method: PUT
body:
  type: json
  content: "{\r

    \  \"email\": \"customer1@email.com\",\r

    \  \"password\": \"123\",\r

    \  \"name\": \"Customer 1 Updated\",\r

    \  \"phone\": \"0123456789\",\r

    \  \"address\": \"123 Main St, New City\"\r

    }"
auth:
  type: bearer
  credentials:
