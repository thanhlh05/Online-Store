$kind: http-request
url: "{{base_url}}/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"username\": \"customer2@email.com\",\r

    \  \"password\": \"123\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Login Customer2 thanh cong - 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      if (pm.response.code === 200) {\r

      \    var res = pm.response.json();\r

      \    pm.environment.set(\"customer2_token\", res.token || res.jwt);\r

      }"
    language: text/javascript
order: 4000
