$kind: http-request
url: "{{base_url}}/register"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"testuser_{{$timestamp}}@email.com\",\r

    \  \"password\": \"123\",\r

    \  \"name\": \"Test User\",\r

    \  \"phone\": \"0987654321\",\r

    \  \"address\": \"123 Test Street\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Đăng ký tài khoản - 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
