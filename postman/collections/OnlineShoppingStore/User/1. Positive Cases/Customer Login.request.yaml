$kind: http-request
url: "{{base_url}}/login"
method: POST
body:
  type: json
  content: |-
    {
      "username": "customer1@email.com",
      "password": "123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login Customer thành công - 200 OK", function () {
          pm.response.to.have.status(200);
      });
      if (pm.response.code === 200) {
          var res = pm.response.json();
          pm.environment.set("customer_token", res.token || res.jwt);
      }
    language: text/javascript
order: 1000
