$kind: http-request
url: "{{base_url}}/profile/customer1@email.com"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Xem đúng Profile - 200 OK", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().email).to.exist;
      });
    language: text/javascript
order: 6000
