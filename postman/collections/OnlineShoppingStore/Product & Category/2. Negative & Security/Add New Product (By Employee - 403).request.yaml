$kind: http-request
url: "{{base_url}}/seller/product/new"
method: POST
body:
  type: json
  content: |-
    {
      "productId": "B000120",
      "productName": "Forbidden Book",
      "productPrice": 40.00,
      "productStock": 50,
      "productDescription": "Book for learning Angular",
      "productIcon": "https://via.placeholder.com/150",
      "categoryType": 0,
      "productStatus": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{employee_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Employee không có quyền thêm SP - Status 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 1000
