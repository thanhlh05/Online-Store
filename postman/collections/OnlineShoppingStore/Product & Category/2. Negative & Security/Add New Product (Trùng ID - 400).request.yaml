$kind: http-request
url: "{{base_url}}/seller/product/new"
method: POST
body:
  type: json
  content: |-
    {
      "productId": "B0001",
      "productName": "Duplicate Book",
      "productPrice": 40.00,
      "productStock": 50,
      "productDescription": "Book",
      "productIcon": "https://via.placeholder.com/150",
      "categoryType": 0,
      "productStatus": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{manager_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Thêm sản phẩm trùng ID - Status 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
