$kind: http-request
url: "{{base_url}}/seller/product/new"
method: POST
body:
  type: json
  content: |-
    {
      "productId": "B000119",
      "productName": "Angular in Action",
      "productPrice": 40.00,
      "productStock": 50,
      "productDescription": "Book for learning Angular",
      "productIcon": "https://via.placeholder.com/150",
      "categoryType": 0,
      "productStatus": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{manager_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Manager thêm SP thành công - 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
