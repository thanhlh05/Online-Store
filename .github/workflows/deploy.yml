name: CD Pipeline (Deploy to Production)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Frontend chuẩn bị cho Docker
        run: |
          cd frontend
          npm install
          npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Giả lập quá trình Deploy (Docker Compose Build)
        run: |
          echo "Bắt đầu quá trình Deploy lên Server..."
          docker compose build
          echo "Deploy thành công! Hệ thống sẵn sàng."