name: CD Pipeline (Deploy to Production)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. CHUẨN BỊ BACKEND (Tạo file .jar)
      - name: Cài đặt Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Đóng gói Backend
        run: |
          cd backend
          mvn clean package -DskipTests=true

      # 2. CHUẨN BỊ FRONTEND (Tạo thư mục dist)
      - name: Cài đặt Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Đóng gói Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      # 3. TIẾN HÀNH DỰNG DOCKER
      - name: Giả lập quá trình Deploy (Docker Compose Build)
        run: |
          echo "Bắt đầu quá trình Deploy lên Server..."
          docker compose build
          echo "Deploy thành công! Hệ thống sẵn sàng."